[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advisorgro"
version = "1.0.0"
description = "AdvisorGro platform: Shield engine, Gro engine, API, workers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "alembic>=1.13",
  "pydantic>=2.6", "pydantic-settings>=2.2", "httpx>=0.27", "jinja2>=3.1",
  "cryptography>=42", "pyjwt[crypto]>=2.8", "email-validator>=2.1", "dnspython>=2.6",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
temporal = ["temporalio>=1.5"]
browser = ["playwright>=1.44"]
aws = ["boto3>=1.34"]
ads = ["google-ads>=24"]
obs = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp>=1.24"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
advisorgro = ["llm/prompts/*.j2", "engine/gro/templates/*.j2", "engine/shield/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
extend-exclude = ["src/advisorgro/engine/shield/mvp", "tests/mvp", "migrations"]
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "E501", "B008"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/advisorgro/adapters/fakes.py" = ["S"]
