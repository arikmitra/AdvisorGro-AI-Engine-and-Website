receivers:
  otlp: {protocols: {grpc: {endpoint: 0.0.0.0:4317}}}
processors:
  batch: {}
  attributes/scrub:   # defence in depth: PII and prompt text must never be span attributes
    actions:
      - {key: email, action: delete}
      - {key: phone, action: delete}
      - {key: prompt, action: delete}
exporters:
  debug: {verbosity: basic}
service:
  pipelines:
    traces: {receivers: [otlp], processors: [attributes/scrub, batch], exporters: [debug]}
