server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8000 http://localhost:8080; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
  location / { try_files $uri /index.html; }
}
